version: '3.8'

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bitrixflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bitrixflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitrixflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-bitrixflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitrixflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrixflow

  # ─── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bitrixflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bitrixflow_user}:${POSTGRES_PASSWORD:-bitrixflow_password}@postgres:5432/${POSTGRES_DB:-bitrixflow}?schema=public
      # Bitrix24 portal
      BITRIX_PORTAL_URL: ${BITRIX_PORTAL_URL:-https://pcicrm.bitrix24.com}
      # Incoming webhook token — used for all Bitrix24 API calls (user list, lead assignment, tasks)
      # Get from: pcicrm.bitrix24.com → Apps → Webhooks → Incoming webhooks
      BITRIX_WEBHOOK_TOKEN: ${BITRIX_WEBHOOK_TOKEN}
      # WhatsApp via WAHA (self-hosted) — see the waha service below
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY}
      # App public URL (used for CORS)
      FRONTEND_URL: ${FRONTEND_URL:-https://manageworkflow-bitrix24.premierchoiceint.online}
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    networks:
      - bitrixflow

  # ─── WAHA (self-hosted WhatsApp HTTP API) ──────────────────────────────────
  # Sends plain-text WhatsApp alerts to sales reps. After first start, open the
  # WAHA dashboard and scan the QR with the WhatsApp number you want to send from.
  waha:
    image: devlikeapro/waha:latest
    container_name: bitrixflow-waha
    restart: unless-stopped
    environment:
      # Secures the API; the api service sends this as the X-Api-Key header.
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # Auto-start the session named "default" on boot.
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
      # Use the NOWEB engine (websocket-based, no Chromium). The default WEBJS
      # engine crash-loops on this host with "ReferenceError: window is not
      # defined" and never finishes pairing. NOWEB is stable on headless servers.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Where WAHA keeps its session store (default; set explicitly for clarity).
      WAHA_LOCAL_STORE_BASE_DIR: /app/.sessions
    volumes:
      # IMPORTANT: a local bind mount, NOT a Docker named volume. WAHA's SQLite
      # store uses WAL journal mode, which fails with "SQLITE_IOERR: disk I/O
      # error" on a named volume on this host. A bind mount to the host's local
      # disk (Dokploy ../files) supports the file locking WAL needs.
      - ../files/waha:/app/.sessions
    ports:
      # Exposed so you can reach the WAHA dashboard (QR scan) from your browser.
      - "${WAHA_PORT:-3001}:3000"
    networks:
      - bitrixflow

  # ─── React Dashboard (Nginx) ───────────────────────────────────────────────
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: bitrixflow-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    networks:
      - bitrixflow

networks:
  bitrixflow:
    driver: bridge

volumes:
  postgres_data:
