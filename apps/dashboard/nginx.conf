server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # Allow Bitrix24 to embed this app in an iframe (required for local app)
    add_header Content-Security-Policy "frame-ancestors https://pcicrm.bitrix24.com https://*.bitrix24.com https://*.bitrix24.ru 'self'" always;
    # Explicitly remove X-Frame-Options so the CSP above takes full control
    add_header X-Frame-Options "" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API proxy — all /api/ requests → NestJS container ────────────────────
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── React SPA — serve index.html for all non-asset routes ────────────────
    # Bitrix24 POSTs to the handler URL on app open — convert to 200
    location / {
        error_page 405 =200 /index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
